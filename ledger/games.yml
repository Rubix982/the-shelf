- id: flash-games
  title: Miniclip and flash games
  year: 2001
  platform: Web browser (Flash)
  by: Miniclip, Newgrounds, Armor Games and many others
  what: >
    Thousands of free browser games — on Miniclip, Newgrounds, Addicting
    Games — made in Adobe Flash, often by one person, played on school and
    family computers.
  great: >
    Anyone could make one and anyone could play one, with no install. It
    was the most open games scene there has ever been.
  mine: >
    Miniclip, at school and on the family computer: 8 Ball Pool, Fireboy
    and Watergirl, Bloons Tower Defense, Motherload.
  where:
    - label: Flashpoint Archive
      url: https://flashpointarchive.org
  status: preserved
  status_note: >
    Flash died at the end of 2020, and the games went with it from the web.
    Flashpoint has archived well over 100,000 of them. If a specific game you
    remember is not in Flashpoint, that one is at risk.
  tags: [browser, flash, formative]

- id: club-penguin
  title: Club Penguin
  year: 2005
  platform: Web browser
  by: New Horizon Interactive, later Disney
  what: >
    A virtual world for kids where you were a penguin: decorate your igloo,
    play minigames for coins, adopt puffles, go to parties.
  great: >
    A safe, cheerful online space for children, with moderated chat and an
    events calendar that made it feel alive.
  mine: >
    Free account only — never a member.
  status: gone
  status_note: >
    Disney shut it down in 2017. Fan-run private servers came and went —
    Club Penguin Rewritten was shut down in 2022 — so there is no official
    way to visit it.
  tags: [browser, mmo, kids, formative]

