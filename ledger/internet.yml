# The early internet. Services, not media — most of them are already gone,
# and what you wrote on them went with them.

- id: msn-messenger
  title: MSN Messenger
  year: 1999
  platform: Windows
  by: Microsoft
  what: >
    Instant messaging: a contact list, display names with song lyrics in
    them, a "now playing" status, emoticons, winks, and the nudge that
    shook the whole window. Later Windows Live Messenger.
  great: >
    It was where after-school life continued. Your display name was a
    public mood, changed several times a day.
  mine: >
    I had an account.
  mentions: [orkut]
  status: gone
  status_note: >
    Shut down in 2013 and folded into Skype. Conversation logs survive only
    if they were saved locally on an old computer — check old drives for
    a "My Received Files" or message history folder.
  tags: [chat, microsoft, formative]

- id: orkut
  title: Orkut
  year: 2004
  platform: Web
  by: Google (Orkut Büyükkökten)
  what: >
    A social network with scraps (wall posts), testimonials written by
    friends, communities for everything, and a fan count. Hugely popular
    in Brazil, India and Pakistan.
  great: >
    Testimonials were public, written praise from friends — something no
    later network kept.
  mine: >
    — your memory goes here —
  mentions: [msn-messenger, early-facebook]
  status: gone
  status_note: >
    Google shut it down in 2014. The export window has long since closed;
    anything you did not download then is gone.
  tags: [social, google]

- id: early-facebook
  title: Early Facebook
  year: 2004
  platform: Web
  by: Facebook
  what: >
    The Facebook of pokes, "is" status updates written in the third person,
    the Wall, photo albums tagged by friends, and the games on this shelf —
    FarmVille, YoVille, Galaxy Legion.
  great: >
    It made keeping up with everyone you had ever met effortless, which was
    new and felt wonderful before it felt like something else.
  mine: >
    The family-account era — the same account I played FarmVille on.
  mentions: [orkut, farmville, yoville, galaxy-legion]
  status: at-risk
  status_note: >
    Your old posts and photos still exist on Facebook's servers for now.
    Download your information from the account settings — that is the only
    copy you control.
  tags: [social]

- id: yahoo-answers
  title: Yahoo Answers and old forums
  year: 2005
  platform: Web
  by: Yahoo, and thousands of forum admins
  what: >
    Ask anything, get answered by strangers — earnestly, badly, or as a
    joke. Alongside it, the phpBB and vBulletin forums for every game,
    band and hobby.
  great: >
    Strangers helping each other for nothing, at enormous scale. The
    answers were often wrong and the place was still valuable.
  mine: >
    Yahoo Answers, for homework.
  status: gone
  status_note: >
    Yahoo Answers closed in May 2021; Archive Team saved a large part of
    it. Most small forums simply vanished when someone stopped paying for
    the hosting — check the Wayback Machine for any you remember.
  where:
    - label: Wayback Machine
      url: https://web.archive.org
  tags: [forums, community]
