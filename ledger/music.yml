- id: music-for-good-times
  title: Music For Good Times ... A Playlist
  platform: YouTube playlist
  by: maintained by me
  ongoing: true
  tracks_file: tracks/music-for-good-times.yml
  notes_file: notes/music-for-good-times.yml
  what: >
    The running playlist on my own channel — the songs I actually listen to a
    lot, added to as I find them rather than curated after the fact. Ninety-nine
    visible tracks as of the first capture. Heavy on Of Monsters and Men, The
    Paper Kites and Novo Amor; a full seam of the Hamilton cast recording; a
    Pakistani and Indian thread running through it (Abdul Hannan, Shamoon
    Ismail, Kaifi Khalil, Ali Sethi, Bilal Saeed, Jasleen Royal, Arijit Singh);
    and a Japanese one (Yorushika, majiko, yama, 『ユイカ』). Fly By Midnight's
    "TFTOOL: Live From The World Circuit" is the newest addition and sits at
    the top.
  great: >
    — why this playlist rather than a service's algorithm. what it is for —
  mine: >
    — your memory goes here. what you were doing while these were on, what a
    particular one is tied to —
  where:
    - label: The playlist itself
      url: https://www.youtube.com/playlist?list=PL0homkxE2DUeoSIMYRYE2PXXqss-pltke
  status: at-risk
  status_note: >
    YouTube says 100 videos; only 99 are served to a logged-out viewer, so one
    is already private or removed. The track list here is the actual artifact:
    the playlist will keep losing entries quietly, and a re-capture diffed
    against this file is the only way to find out which ones.
  tags: [playlist, mine, ongoing]

- id: linkin-park
  title: Linkin Park
  year: 2000
  platform: Warner Bros. Records
  by: Linkin Park
  what: >
    Nu-metal and rap-rock from Los Angeles: Chester Bennington's screaming
    and Mike Shinoda's rapping over electronic production. Hybrid Theory
    (2000) and Meteora (2003), with "In the End," "Numb," and "Crawling."
  great: >
    It gave a generation of teenagers words for feeling overwhelmed, without
    irony. "In the End" is still one of the most-played rock songs of the
    century.
  mine: >
    Reached me through game soundtracks and anime music videos, and
    YouTube on the family computer.
  status: preserved
  tags: [rock, nu-metal, formative]

- id: eminem
  title: Eminem
  year: 1999
  platform: Aftermath / Interscope
  by: Eminem
  what: >
    The Slim Shady LP (1999), The Marshall Mathers LP (2000), The Eminem
    Show (2002), and "Lose Yourself" from 8 Mile.
  great: >
    Technical rapping — rhymes inside rhymes — at a pace few could match,
    and "Lose Yourself" became the song people played before anything that
    mattered.
  mine: >
    Reached me through game soundtracks and anime music videos, and
    YouTube on the family computer.
  status: preserved
  tags: [hip-hop, formative]

- id: coldplay
  title: Coldplay
  year: 2000
  platform: Parlophone
  by: Coldplay
  what: >
    Parachutes (2000), A Rush of Blood to the Head (2002), X&Y (2005) and
    Viva la Vida (2008): "Yellow," "The Scientist," "Fix You," "Viva la
    Vida."
  great: >
    Earnest, melodic songs that never pretended to be cool. "Fix You" is
    one of those songs people remember the exact moment they needed.
  mine: >
    Reached me through game soundtracks and anime music videos, and
    YouTube on the family computer.
  status: preserved
  tags: [rock, pop]

- id: coke-studio-pakistan
  title: Coke Studio Pakistan
  year: 2008
  platform: TV / YouTube
  by: Rohail Hyatt (founding producer)
  what: >
    A studio music show pairing folk, qawwali and classical singers with
    pop and rock musicians, recorded live. "Alif Allah (Jugni)," "Tajdar-e-Haram,"
    and, later, "Pasoori."
  great: >
    It made traditional music sound new to a young audience, and gave
    singers from different regions and generations one stage.
  mine: >
    On TV with the family, later on YouTube, and on car rides.
  mentions: [atif-aslam, strings]
  status: preserved
  status_note: >
    Its official YouTube channel holds most seasons.
  tags: [pakistani, folk, fusion, formative]

- id: strings
  title: Strings
  year: 1990
  platform: EMI Pakistan
  by: Bilal Maqsood & Faisal Kapadia
  what: >
    A Karachi pop-rock band. "Duur" (2000), "Najane Kyun" (used in the
    Hindi Spider-Man 2), "Zinda."
  great: >
    Clean, melodic pop-rock that sounded like Pakistan to a generation.
  mine: >
    Car rides, mostly.
  mentions: [junoon, coke-studio-pakistan]
  status: preserved
  tags: [pakistani, rock, pop]

- id: junoon
  title: Junoon
  year: 1990
  platform: EMI Pakistan
  by: Salman Ahmad, Ali Azmat, Brian O'Connell
  what: >
    "Sufi rock": electric guitar and Sufi poetry. "Sayonee" (1997),
    "Jazba-e-Junoon," "Khudi."
  great: >
    It joined rock with Pakistan's own mystical poetry instead of copying
    Western bands, and "Sayonee" was a hit across South Asia.
  mine: >
    Car rides, mostly.
  mentions: [strings]
  status: preserved
  tags: [pakistani, rock, sufi]

- id: atif-aslam
  title: Atif Aslam
  year: 2004
  by: Atif Aslam
