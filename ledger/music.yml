- id: nusrat-fateh-ali-khan
  title: Nusrat Fateh Ali Khan
  year: 1971
  platform: Qawwali
  by: Nusrat Fateh Ali Khan
  what: >
    The greatest qawwali singer of the twentieth century: "Mast Qalandar,"
    "Afreen Afreen," "Tumhe Dillagi," "Mera Piya Ghar Aaya." Brought
    qawwali to the world through Peter Gabriel's Real World label. Died
    in 1997.
  great: >
    Performances that build for twenty minutes until the whole room is
    carried. Nothing in recorded music sounds like it.
  mine: >
    Car rides, mostly.
  mentions: [coke-studio-pakistan]
  status: preserved
  tags: [pakistani, qawwali, sufi]

