# The human half of the playlist, keyed by YouTube video id.
#
# scripts/capture-playlist.mjs never touches this file — it only rewrites
# ledger/tracks/. So a re-capture can lose a track without losing what you
# wrote about it.
#
# `artist` and `song` are here because YouTube's own data is unreliable: the
# uploader is frequently a lyric-video reposter rather than the band, and the
# real artist is usually buried in the video title. These were corrected by
# hand. `genre` is a rough bucket, meant for grouping rather than precision.
#
# `lyric` is for one or two lines — the bit that actually gets you — not the
# whole song. Full lyrics are not ours to redistribute, and `lyrics_url` on the
# entry links out for the rest. `note` is your expansion: what the line means,
# what it is attached to. Both start empty because they are yours to write.
#
# Add them like this:
#
#   ghb6eDopW8I:
#     artist: Of Monsters and Men
#     song: Little Talks
#     genre: indie folk
#     lyric: |
#       Though the truth may vary
#       this ship will carry our bodies safe to shore
#     note: >
#       Why this one stuck.

