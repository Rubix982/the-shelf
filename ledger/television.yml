- id: dark
  title: Dark
  year: 2017
  platform: Netflix
  by: Baran bo Odar & Jantje Friese
  what: >
    A German series about four families in the small town of Winden whose
    lives loop across 1953, 1986 and 2019 after a child disappears near
    the caves under the nuclear plant. Three seasons, 2017–2020.
  great: >
    It knew its ending before it began and kept every promise its puzzle
    made. Time-travel stories usually cheat on their own rules; Dark used
    them as the plot, and the family-tree diagram became something viewers
    actually needed.
